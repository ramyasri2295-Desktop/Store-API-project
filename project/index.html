<style>
    /* mobile */

    @media(max-width:426px) {
        #header {
            display: flex;

            align-items: center;

        }

            list-style: none;
            display: flex;
            gap: 10px;
        }

        }

        #header {
            display: flex;

            align-items: center;
            padding: 10px 20px;
        }

            list-style: none;
            display: flex;

        }

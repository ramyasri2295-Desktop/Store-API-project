<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="./style.css">
</head>

<body>



    <!-- header section -->
    <section id="header">
        <div>
            <h1>Ecommerce</h1>
        </div>
        <ul id="content">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="headbut">
            <a href="login.html" class="btn">
                <button> <i class="fa-solid fa-arrow-right-to-bracket"></i> Login</button>
            </a>

            <a href="register.html" class="btn">
                <button><i class="fas fa-user-plus"></i> Register</button>
            </a>

            <a href="cart.html" class="btn">
                <button>
                    <i class="fas fa-shopping-cart"></i>
                    Cart (<span id="cart-count">0</span>)
                </button>
            </a>

        </div>

    </section>


    <!-- cart section -->


    <section class="cart-section">
        <h1>Cart</h1>
        <hr>

        <div class="cart-wrapper">

            <!-- Left Side -->
            <div class="cart-left">
                <div id="cart-container"></div>

                <!-- Empty Cart Message -->
                <div id="empty-cart" class="empty-cart">
                    <h2>Your Cart is Empty</h2>
                   <a href="index.html">
                        <button class="continue-btn">
                            <i class="fa-solid fa-arrow-left"></i> Continue Shopping
                        </button>
                    </a>
                </div>

            </div>

           
            <!-- Right Side -->
            <div class="cart-right" id="order-summary">
                <h3>Order Summary</h3>
                <p>Products (<span id="item-count">0</span>)
                    <span id="subtotal">$0</span>
                </p>
                <p>Shipping <span>$30</span></p>
                <h4>Total amount <span id="total">$0</span></h4>
                <button class="checkout-btn">Go to checkout</button>
            </div>


        </div>
    </section>



    <!-- Footer -->
    <footer class="foot">
        Made with ❤️ by Ramya
    </footer>

    <script src="./pro.js"></script>



</body>

</html>
